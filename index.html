<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides - Grupo Trindade</title>
    <!-- Ícone da aba do navegador (favicon) gerado como SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23d4af37' d='M256 0c17.7 0 32 14.3 32 32v35.8C353.4 92 400 157.9 400 238.1v65.9c0 4.6 2.3 8.9 6.1 11.5l38.4 25.6c15 10 24.1 26.6 25.4 44.6C471.2 404 456.1 416 438.2 416H368v64c0 17.7-14.3 32-32 32H176c-17.7 0-32-14.3-32-32V416H73.8c-17.9 0-33-12-31.7-30.3c1.3-18 10.4-34.6 25.4-44.6l38.4-25.6c3.8-2.5 6.1-6.8 6.1-11.5V238.1C112 157.9 158.6 92 224 67.8V32c0-17.7 14.3-32 32-32zM176 416V352c0-44.2 35.8-80 80-80s80 35.8 80 80v64H176z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            /* Azul marinho muito escuro */
            --card-bg: rgba(30, 41, 59, 0.7);
            --gold: #d4af37;
            --gold-hover: #fcd34d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Contêiner Principal (Card) */
        .portal-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tipografia */
        .icon-header {
            font-size: 40px;
            color: var(--gold);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 300;
            margin: 0 0 40px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Lista de Arquivos */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Scrollbar customizada */
        .file-list::-webkit-scrollbar {
            width: 6px;
        }
        .file-list::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 10px;
        }
        .file-list::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }
        .file-list::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.5);
        }

        .file-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.3s ease;
            text-align: left;
        }

        .file-item:hover {
            border-color: rgba(212, 175, 55, 0.6);
            background: rgba(15, 23, 42, 0.8);
            transform: translateY(-2px);
        }

        .file-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .file-item-info i {
            color: #ff5252;
            font-size: 24px;
            flex-shrink: 0;
        }

        .file-name {
            font-size: 14px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: #111;
            border: none;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 5px 15px -5px rgba(212, 175, 55, 0.5);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.7);
            background: linear-gradient(135deg, var(--gold-hover) 0%, var(--gold) 100%);
        }

        #loadingState {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Spinner de Carregamento */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--gold);
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="portal-card">
        <div class="icon-header">
            <i class="fa-solid fa-place-of-worship"></i>
        </div>
        <h1>Grupo Trindade</h1>
        <p class="subtitle">Material Litúrgico</p>

        <div id="loadingState">
            <div class="loader" id="btnLoader"></div>
            <p id="status">Procurando arquivos recentes...</p>
        </div>

        <div id="fileListContainer" class="file-list" style="display: none;">
            <!-- Os arquivos serão inseridos aqui pelo JavaScript -->
        </div>
    </div>

    <script>
        async function loadFile() {
            const loadingState = document.getElementById('loadingState');
            const fileListContainer = document.getElementById('fileListContainer');
            const status = document.getElementById('status');
            const btnLoader = document.getElementById('btnLoader');

            try {
                const res = await fetch('/api/get-slides');
                if (!res.ok) throw new Error('Falha ao buscar arquivo');

                const data = await res.json(); // Array de arquivos

                // Esconde o loading
                loadingState.style.display = 'none';

                if (Array.isArray(data) && data.length > 0) {
                    fileListContainer.style.display = 'flex';
                    fileListContainer.innerHTML = ''; // Limpa a lista

                    data.forEach(file => {
                        const isPdf = file.name.toLowerCase().endsWith('.pdf');
                        const iconClass = isPdf ? 'fa-solid fa-file-pdf' : 'fa-solid fa-file-powerpoint';
                        
                        // Cria o elemento da lista
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'file-item';
                        itemDiv.innerHTML = `
                            <div class="file-item-info" title="${file.name}">
                                <i class="${iconClass}"></i>
                                <span class="file-name">${file.name}</span>
                            </div>
                            <button class="download-btn" onclick="window.location.href='${file.downloadUrl}'" title="Baixar Arquivo">
                                <i class="fa-solid fa-download"></i>
                            </button>
                        `;
                        fileListContainer.appendChild(itemDiv);
                    });
                } else {
                    throw new Error('Nenhum arquivo encontrado');
                }

            } catch (error) {
                // Interface de Erro
                btnLoader.style.display = 'none';
                status.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color: #ff5252; font-size: 24px; display: block; margin-bottom: 10px;"></i> Nenhuma apresentação encontrada.';
                console.error(error);
            }
        }

        // Executa a busca
        loadFile();
    </script>
</body>

</html>
