<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides - Grupo Trindade</title>
    <!-- Ícone da aba do navegador (favicon) gerado como SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path fill='%23d4af37' d='M344 24c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 24-32 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l32 0 0 46.4L183.3 210c-14.5 8.7-23.3 24.3-23.3 41.2L160 512l96 0 0-96c0-35.3 28.7-64 64-64s64 28.7 64 64l0 96 96 0 0-260.8c0-16.9-8.8-32.5-23.3-41.2L344 142.4 344 96l32 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-32 0 0-24zM24.9 330.3C9.5 338.8 0 354.9 0 372.4L0 464c0 26.5 21.5 48 48 48l80 0 0-238.4L24.9 330.3zM592 512c26.5 0 48-21.5 48-48l0-91.6c0-17.5-9.5-33.6-24.9-42.1L512 273.6 512 512l80 0z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            /* Azul marinho muito escuro */
            --card-bg: rgba(30, 41, 59, 0.7);
            --gold: #d4af37;
            --gold-hover: #fcd34d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Contêiner Principal (Card) */
        .portal-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tipografia */
        .icon-header {
            font-size: 40px;
            color: var(--gold);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 300;
            margin: 0 0 40px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Lista de Arquivos */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-height: 350px;
            overflow-y: auto;
            padding: 4px 5px 4px 4px; /* Adicionado padding para a animação não cortar a borda */
        }

        /* Scrollbar customizada */
        .file-list::-webkit-scrollbar {
            width: 6px;
        }
        .file-list::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 10px;
        }
        .file-list::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }
        .file-list::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.5);
        }

        .file-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.3s ease;
            text-align: left;
        }

        .file-item:hover {
            border-color: rgba(212, 175, 55, 0.6);
            background: rgba(15, 23, 42, 0.8);
            transform: translateY(-2px);
        }

        .file-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .file-item-info i {
            color: #ff5252;
            font-size: 24px;
            flex-shrink: 0;
        }

        .file-name {
            font-size: 14px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: #111;
            border: none;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 5px 15px -5px rgba(212, 175, 55, 0.5);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.7);
            background: linear-gradient(135deg, var(--gold-hover) 0%, var(--gold) 100%);
        }

        #loadingState {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Spinner de Carregamento */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--gold);
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="portal-card">
        <div class="icon-header">
            <i class="fa-solid fa-church"></i>
        </div>
        <h1>Grupo Trindade</h1>
        <p class="subtitle">Material Litúrgico</p>

        <div id="loadingState">
            <div class="loader" id="btnLoader"></div>
            <p id="status">Procurando arquivos recentes...</p>
        </div>

        <div id="fileListContainer" class="file-list" style="display: none;">
            <!-- Os arquivos serão inseridos aqui pelo JavaScript -->
        </div>
    </div>

    <script>
        async function loadFile() {
            const loadingState = document.getElementById('loadingState');
            const fileListContainer = document.getElementById('fileListContainer');
            const status = document.getElementById('status');
            const btnLoader = document.getElementById('btnLoader');

            try {
                const res = await fetch('/api/get-slides');
                if (!res.ok) throw new Error('Falha ao buscar arquivo');

                const data = await res.json(); // Array de arquivos

                // Esconde o loading
                loadingState.style.display = 'none';

                if (Array.isArray(data) && data.length > 0) {
                    fileListContainer.style.display = 'flex';
                    fileListContainer.innerHTML = ''; // Limpa a lista

                    // Função para determinar o ícone baseado na extensão
                    const getFileIconClass = (filename) => {
                        const ext = filename.toLowerCase().split('.').pop();
                        const icons = {
                            'pdf': 'fa-solid fa-file-pdf',
                            'ppt': 'fa-solid fa-file-powerpoint',
                            'pptx': 'fa-solid fa-file-powerpoint',
                            'doc': 'fa-solid fa-file-word',
                            'docx': 'fa-solid fa-file-word',
                            'mp3': 'fa-solid fa-file-audio',
                            'wav': 'fa-solid fa-file-audio',
                            'jpg': 'fa-solid fa-file-image',
                            'jpeg': 'fa-solid fa-file-image',
                            'png': 'fa-solid fa-file-image',
                            'gif': 'fa-solid fa-file-image',
                            'mp4': 'fa-solid fa-file-video',
                            'xls': 'fa-solid fa-file-excel',
                            'xlsx': 'fa-solid fa-file-excel',
                            'zip': 'fa-solid fa-file-zipper',
                            'rar': 'fa-solid fa-file-zipper',
                            'txt': 'fa-solid fa-file-lines'
                        };
                        return icons[ext] || 'fa-solid fa-file'; // fa-file genérico caso não encontre
                    };

                    data.forEach(file => {
                        const iconClass = getFileIconClass(file.name);
                        
                        // Cria o elemento da lista
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'file-item';
                        itemDiv.innerHTML = `
                            <div class="file-item-info" title="${file.name}">
                                <i class="${iconClass}"></i>
                                <span class="file-name">${file.name}</span>
                            </div>
                            <button class="download-btn" onclick="window.location.href='${file.downloadUrl}'" title="Baixar Arquivo">
                                <i class="fa-solid fa-download"></i>
                            </button>
                        `;
                        fileListContainer.appendChild(itemDiv);
                    });
                } else {
                    throw new Error('Nenhum arquivo encontrado');
                }

            } catch (error) {
                // Interface de Erro
                btnLoader.style.display = 'none';
                status.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color: #ff5252; font-size: 24px; display: block; margin-bottom: 10px;"></i> Nenhuma apresentação encontrada.';
                console.error(error);
            }
        }

        // Executa a busca
        loadFile();
    </script>
</body>

</html>
