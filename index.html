<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides - Grupo Trindade</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        button {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            background: #d4af37;
            /* Dourado litúrgico */
            color: #121212;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: #b5952f;
            transform: scale(1.05);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status {
            margin-top: 20px;
            color: #aaaaaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1 style="color: #d4af37; margin-bottom: 40px;">Grupo Trindade</h1>

    <button id="downloadBtn" disabled>Buscando arquivo...</button>
    <p id="status">Conectando ao servidor...</p>

    <script>
        async function loadFile() {
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');

            try {
                const res = await fetch('/api/get-slides');
                if (!res.ok) throw new Error('Falha ao buscar arquivo');

                const data = await res.json();

                btn.textContent = 'BAIXAR SLIDES DE HOJE';
                btn.disabled = false;
                status.textContent = `Arquivo pronto: ${data.name}`;

                btn.onclick = () => {
                    window.location.href = data.downloadUrl;
                };

            } catch (error) {
                btn.textContent = 'ERRO';
                status.textContent = 'Não foi possível encontrar o arquivo da semana.';
                console.error(error);
            }
        }

        // Executa a busca assim que a página carrega
        loadFile();
    </script>
</body>

</html>
