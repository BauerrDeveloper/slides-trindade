<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides - Grupo Trindade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            /* Azul marinho muito escuro */
            --card-bg: rgba(30, 41, 59, 0.7);
            --gold: #d4af37;
            --gold-hover: #fcd34d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Contêiner Principal (Card) */
        .portal-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tipografia */
        .icon-header {
            font-size: 40px;
            color: var(--gold);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 300;
            margin: 0 0 40px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Apresentação do Arquivo */
        .file-info-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .file-info-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .file-info-box i {
            color: #ff5252;
            /* Cor vermelha para destacar que é um pptx/pdf */
            font-size: 24px;
        }

        #status {
            color: var(--text-muted);
            font-size: 14px;
            word-break: break-all;
            margin: 0;
        }

        /* Botão Dourado */
        button {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: #111;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(212, 175, 55, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -10px rgba(212, 175, 55, 0.7);
            background: linear-gradient(135deg, var(--gold-hover) 0%, var(--gold) 100%);
        }

        button:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Spinner de Carregamento */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--gold);
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="portal-card">
        <div class="icon-header">
            <i class="fa-solid fa-place-of-worship"></i>
        </div>
        <h1>Grupo Trindade</h1>
        <p class="subtitle">Material Litúrgico</p>

        <div class="file-info-box" id="fileBox">
            <i class="fa-solid fa-file-powerpoint" id="fileIcon"></i>
            <p id="status">Procurando arquivos recentes...</p>
        </div>

        <button id="downloadBtn" disabled>
            <div class="loader" id="btnLoader"></div>
            <span id="btnText">Conectando...</span>
        </button>
    </div>

    <script>
        async function loadFile() {
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const fileBox = document.getElementById('fileBox');
            const fileIcon = document.getElementById('fileIcon');

            try {
                const res = await fetch('/api/get-slides');
                if (!res.ok) throw new Error('Falha ao buscar arquivo');

                const data = await res.json();

                // Atualiza a Interface de Sucesso
                btnLoader.style.display = 'none';
                btnText.innerHTML = '<i class="fa-solid fa-download"></i> BAIXAR REPERTÓRIO';
                btn.disabled = false;

                status.innerHTML = `<strong>Pronto para baixar:</strong><br>${data.name}`;

                // Mostra a caixinha com animação
                fileBox.classList.add('visible');

                // Muda o ícone se for PDF
                if (data.name.toLowerCase().endsWith('.pdf')) {
                    fileIcon.className = 'fa-solid fa-file-pdf';
                }

                // Ação de Clique
                btn.onclick = () => {
                    window.location.href = data.downloadUrl;
                };

            } catch (error) {
                // Interface de Erro
                btnLoader.style.display = 'none';
                btnText.textContent = 'Indisponível no momento';
                status.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color: #ff5252;"></i> Nenhuma apresentação encontrada para hoje.';
                fileBox.classList.add('visible');
                console.error(error);
            }
        }

        // Executa a busca
        loadFile();
    </script>
</body>

</html>
